base_image: peakflow/base-ubuntu-24-04@sha256:9b23d3d5f82a8babb312b7ce549e02d60a6f32344b0088b90d3f486a9d8207a5
environment:
  GEM_HOME: /home/build/.rvm/gems/default
  GEM_PATH: /home/build/.rvm/gems/default:/home/build/.rvm/gems/default@global
  PATH: /home/build/.rvm/gems/default/bin:/home/build/.rvm/gems/default@global/bin:/home/build/.rvm/rubies/default/bin:/home/build/.rvm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  RUBY_VERSION: 3.2.2
before_install:
  - >-
    sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get
    -o Acquire::Retries=5 update
  - >-
    sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get
    -o Acquire::Retries=5 install --yes
    build-essential curl libffi-dev libreadline-dev libssl-dev libyaml-dev
    pkg-config zlib1g-dev
  - >-
    if [ ! -s /home/build/.rvm/scripts/rvm ]; then
    curl -fsSL https://get.rvm.io | bash -s stable;
    fi
  - >-
    /bin/bash -lc
    "source /home/build/.rvm/scripts/rvm &&
    rvm install '$RUBY_VERSION' &&
    rvm use '$RUBY_VERSION' --default &&
    gem install bundler -v 2.3.8 --no-document"
before_install_signature_files:
  - Gemfile.lock
builds:
  build_1:
    environment:
      RUBY_VERSION: 3.2.2
    name: Ruby 3.2.2
    # Deny-list shape so an unlisted path still runs the lane: only paths proven not to be
    # read by `bundle install` + `rspec` are negated. Gemfile, Gemfile.lock, the gemspec and
    # VERSION are never negated because the install each lane runs is lockfile-driven.
    paths:
      - "**"
      - "!.document"
      - "!.github/**"
      - "!.gitignore"
      - "!LICENSE.txt"
      - "!README.md"
      - "!.rubocop.yml"
    script:
      - bundle install --jobs 6 --retry 3
      - bundle exec rspec
  build_2:
    environment:
      RUBY_VERSION: 3.3.10
    name: Ruby 3.3.10
    paths:
      - "**"
      - "!.document"
      - "!.github/**"
      - "!.gitignore"
      - "!LICENSE.txt"
      - "!README.md"
      - "!.rubocop.yml"
    script:
      - bundle install --jobs 6 --retry 3
      - bundle exec rspec
  build_3:
    environment:
      RUBY_VERSION: 3.4.10
    name: Ruby 3.4.10
    paths:
      - "**"
      - "!.document"
      - "!.github/**"
      - "!.gitignore"
      - "!LICENSE.txt"
      - "!README.md"
      - "!.rubocop.yml"
    script:
      - bundle install --jobs 6 --retry 3
      - bundle exec rspec
  build_4:
    name: Rubocop
    # `.rubocop.yml` is not negated here: it is this lane's own configuration, so a change to
    # it changes this lane's verdict. `spec/**/*.json` is negated because rubocop inspects only
    # Ruby files (`bundle exec rubocop --list-target-files` lists no fixture), while the rspec
    # lanes do read those fixtures and therefore keep them.
    paths:
      - "**"
      - "!.document"
      - "!.github/**"
      - "!.gitignore"
      - "!LICENSE.txt"
      - "!README.md"
      - "!spec/**/*.json"
    script:
      - bundle install --jobs 6 --retry 3
      - bundle exec rubocop
